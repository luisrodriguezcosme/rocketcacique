name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro build
      # A private game, shared by link only. It's built from its own private repo and placed at an address
      # kept in the GAME_PATH secret, so neither the game nor its address is in this public repo.
      # Without the GAME_TOKEN secret these steps are skipped and the site publishes as usual.
      - id: game
        env:
          GAME_TOKEN: ${{ secrets.GAME_TOKEN }}
        run: echo "on=$([ -n "$GAME_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.game.outputs.on == 'yes'
        uses: actions/checkout@v4
        with:
          repository: cru-Luis-Rodriguez/bobblehead-boxing
          token: ${{ secrets.GAME_TOKEN }}
          path: game
          persist-credentials: false
      - if: steps.game.outputs.on == 'yes'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: game/package.json
      - if: steps.game.outputs.on == 'yes'
        working-directory: game
        run: pnpm install --frozen-lockfile && pnpm build
      - if: steps.game.outputs.on == 'yes'
        env:
          GAME_PATH: ${{ secrets.GAME_PATH }}
        run: |
          case "$GAME_PATH" in
            ''|/*|*..*|*[!a-z0-9/-]*) echo "::error::GAME_PATH must be lowercase letters, digits, dashes and slashes"; exit 1 ;;
          esac
          mkdir -p "dist/$GAME_PATH"
          cp game/dist/bobblehead-boxing.html "dist/$GAME_PATH/index.html"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Anyone can download a public repo's run artifacts, and this one holds the private game and its address,
      # so it's deleted as soon as the deploy is done (or fails).
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
